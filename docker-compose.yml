services:
  mysql_staging:
    image: mysql:8
    container_name: mysql_staging
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: etl_sales
    ports:
      - "3308:3306"
    volumes:
      - mysql_staging_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql_dw:
    image: mysql:8
    container_name: mysql_dw
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: etl_dw
    ports:
      - "3309:3306"
    volumes:
      - mysql_dw_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_etl
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq_etl
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_staging_data:
  mysql_dw_data:
